default_return_format: >-
  Return a compact result. For success: status, one-sentence summary, changed
  files, checks run with short results, artifact path if available, and next
  required action. For failed, blocked, timed out, or incomplete work: status,
  one-sentence summary, completed work, changed files, exact blocker or failed
  check, artifact path, and where the next subagent should continue. Do not
  include full stdout, full diffs, logs, or long reasoning in the return.
tool_description: >-
  Use orch_dispatch for all scoped work: research, repository or file inspection,
  implementation, debugging, test execution, verification, review, security
  assessment, and follow-up work. The orchestrator plans, prepares artifacts,
  dispatches, sequences dependent slices, handles user decisions and approvals,
  updates project documentation or standard artifacts, and synthesizes returned
  subagent results. Subagents inspect sources, implement, debug, test, verify,
  review, assess security, and produce compact evidence. Before starting work,
  inspect the whole request and identify every slice that can be assigned to a
  subagent. Call orch_dispatch once per slice and make multiple calls when
  several slices are available and do not conflict or depend on each other.
  Always dispatch all currently unblocked, independent slices in parallel before
  continuing orchestrator work; do not wait for one independent subagent before
  dispatching the others. Read-only research, independent analysis, and
  independent reviews should normally run in parallel. Parallel write slices must
  own separate files or resources. Keep dependency-bound work in order: dispatch
  required research before dependent planning or design, implementation after the
  evidence or plan it depends on is available, and verification, review, and
  security assessment after the relevant implementation exists. Prefer
  artifact-first handoff: write known task context to an artifact, then dispatch
  with the artifact path, exact scope, boundaries, stop condition, and expected
  return. Use longer dispatch context only when the subagent cannot succeed from
  the artifact and scope alone. Calling orch_dispatch transfers ownership of that
  slice to the subagent. After transfer, the orchestrator waits for the automatic
  return for that scope. If other independent slices are ready, dispatch them;
  otherwise end the turn and wait. Trust returned subagent results for their
  assigned scope. On success, continue sequencing or synthesize. On blocked,
  failed, timed-out, cancelled, or incomplete results, dispatch a smaller
  follow-up or ask the user for the required decision. Boundary: after dispatch,
  the orchestrator does not perform the transferred scope itself; it does not
  build, debug, test, verify, review, security-review, inspect files, rerun
  checks, confirm results, cancel because it duplicated work, or poll for
  completion. Specialist caps: verifier gets one pass per assigned acceptance
  scope and uses builder evidence first; reviewer gets one findings pass per
  assigned diff or scope; appsec gets one security pass per changed trust
  boundary or scope. Repeat those roles only for failed, blocked, timed-out,
  cancelled, incomplete, or explicitly changed follow-up scope. Verifiers run
  only missing, distinct, or adversarial checks and do not repeat unchanged
  builder commands. Reviewers and appsec do not run generic functional tests or
  implement fixes. Subagent reports return automatically. Status/history are
  explicit diagnostic/control tools, not completion waiting mechanisms. Before
  final response, ensure all dispatched subagents are terminal and their returned
  results have been consumed. {roles}
tool_prompt_snippet: Use Orchestra tools to delegate work.
tool_prompt_guidelines:
  - Follow the shared orch_dispatch and orch_status descriptions.
  - After dispatch, wait for automatic subagent returns for transferred scopes; use orch_status only for explicit status/control needs.
tool_goal_description: >-
  One small subagent slice: goal, exact scope, stop condition, and return shape.
tool_role_description: >-
  Optional subagent capability. Choose the enabled role that best matches the
  slice. Omit role when no specialized enabled role is a better match than the
  default. Use distinct roles for independent research, planning, implementation,
  verification, review, and security judgment. {roles}
tool_task_label_description: Optional short request label.
status_description: >-
  Use orch_status for explicit user-requested diagnostics, history, roles,
  setup/help, activation, or stopping an owned active run. Use status for active
  subagents, history for completed subagent results, roles for available
  read-only role information, doctor for setup checks, help for usage, on to
  activate Orchestra orchestration guidance, and stop with a runId to cancel an
  owned active run. Use orch_dispatch to start work. Completed subagent reports
  return automatically; the orchestrator waits for returns and uses
  status/history as diagnostic and control surfaces rather than completion loops.
status_action_description: >-
  Action to perform: help, doctor, roles, status, history, on, or stop. Use stop
  only with a runId for an active run owned by the current host session.
status_limit_description: Optional positive history limit for action=history.
status_run_id_description: Required run id when action=stop.
status_role_description: Reserved for compatibility; action=roles lists all configured roles.
status_setting_description: Reserved for role updates; model-callable roles are read-only for now.
status_value_description: Reserved for role updates; model-callable roles are read-only for now.
dispatch_ack_template: |-
  orchestra dispatched:{role_text} {run_id}
  Next: wait for the automatic subagent return. The subagent owns this scope.
  You may dispatch other independent slices now; otherwise wait.
concurrency_limit_hint: >-
  Dispatch was not accepted because capacity is full. Wait for active subagent
  returns, then dispatch the next ready slice.
failed_return_next: >-
  dispatch a targeted follow-up with this artifact, or ask the user if a decision
  is required
budget_exceeded_prompt: |-
  [Orchestra subagent budget exceeded]
  Stop everything you're doing immediately.

  Your only task now, is to create a handoff for the next agent,
  do not continue any previous work.

  Start with:

  ORCHESTRA_STATUS: incomplete
  ORCHESTRA_STOP_REASON: budget_exceeded

  Then include:

  ## Budget Handoff

  Completed:
  - Specific work completed.
  - Files changed, files inspected, commands run, or evidence gathered.

  Current state and data locations:
  - Relevant file paths, logs, artifacts, transcripts, notes, run ids, or database/state locations.
  - Anything the next agent needs to avoid rediscovering or redoing work.

  Remaining work:
  - Specific incomplete items.
  - Known decisions still needed.

  Suggested smaller redispatch slices:
  - 2-5 minute continuation tasks.
  - Mark slices as sequential, parallel-safe, or blocked.
  - Make the next slice small enough to avoid hitting the same budget.

  Verification:
  - Checks already run and results.
  - Checks still needed.

  Blockers and risks:
  - Anything that may prevent continuation or require caller approval.

  Caller guidance:
  - Tell the calling agent to redispatch from this handoff rather than restarting completed work.
host_help: |-
  Orchestra commands:
    /orch help                         Show this help
    /orch on                           Load the orchestra orchestrator skill
    /orch doctor                       Check Orchestra setup
    /orch do <request>                 Dispatch a subagent
    /orch do --role ROLE <request>     Start a subagent with a role
    /orch roles                        Show configured roles
    /orch roles ROLE SETTING VALUE     Update a role setting
                                       Settings: harness, enabled, model, profile, agent
                                       VALUE for enabled: true, yes, y, 1, on | false, no, n, 0, off
    /orch status                       Show active subagents for this session
    /orch stop <run-id>                Stop an active subagent.
    /orch history [limit]              Show recent results for this session

  Plain text: ask me to delegate, dispatch, use a subagent/sub-agent, ask a subagent,
  or ask another agent.
  auto_return: prompt orchestrator upon return of subagents
