# Orchestra agent catalog
default_role: worker
roles:
  worker:
    harness: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - pi
      - --no-session
      - --model
      - "{model}"
      - -p
      - "{prompt}"

  reviewer:
    harness: pi
    model: openai-codex/gpt-5.4
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - pi
      - --no-session
      - --model
      - "{model}"
      - -p
      - "{prompt}"

  critic:
    harness: hermes
    profile: tori
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - hermes
      - --profile
      - "{profile}"
      - -z
      - "{prompt}"

  researcher:
    harness: hermes
    profile: tori
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - hermes
      - --profile
      - "{profile}"
      - -z
      - "{prompt}"

  appsec:
    harness: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - pi
      - --no-session
      - --model
      - "{model}"
      - -p
      - "{prompt}"

  planner:
    harness: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Focus on the assigned task and return a compact result.
    command:
      - pi
      - --no-session
      - --model
      - "{model}"
      - -p
      - "{prompt}"
