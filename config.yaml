state_dir: ~/workspace/orchestra/state
log_dir: ~/workspace/orchestra/logs
default_timeout: 1200
turn_limit: 30     # Global cooperative worker turn budget before handoff.
soft_timeout: 900 # Global cooperative timeout seconds before handoff; must be below default_timeout.
pass_context_timeout: 300 # Max seconds spent generating a focused parent-context briefing.
concurrency:
  global: 6
  per_session: 3
auto_return: true
