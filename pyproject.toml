[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Agent-agnostic orchestration control plane for focused worker agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "LunarNexus" }]
dependencies = [
  "PyYAML>=6.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestra = [
  "assets/config.yaml",
  "assets/prompts.yaml",
  "assets/agent-catalog.yaml",
  "assets/pi/orchestra/index.ts",
]

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
pretty = true
show_error_codes = true
strict = true
mypy_path = "src"
