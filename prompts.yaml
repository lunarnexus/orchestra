# Prompt text for Orchestra 2, loaded as a flat key -> text map by
# orchestra.config.load_prompts. Missing required keys and unknown keys are
# loud ConfigError failures; there are no defaults or fallbacks.

# ---------------------------------------------------------------------------
# tool_response: text the harness plugin returns to the calling orchestrator
# session immediately after a dispatch is accepted, while execution continues
# in the background. The orchestrator does not poll.
# ---------------------------------------------------------------------------
dispatch_ack: |-
  Assignment accepted and running in the background. The subagent owns the
  delegated scope until it returns; do not edit that scope or verify it
  independently. Do not poll or sleep waiting for it — continue your own
  independent work or end your response. Orchestra returns the results to
  this session when every dispatched job and configured follow-up finishes.

# ---------------------------------------------------------------------------
# budget_intervention: text sent to a subagent when its turn limit or soft
# timeout is reached, telling it to stop and produce a continuation handoff.
# ---------------------------------------------------------------------------
budget_intervention: |-
  Your turn or time budget for this assignment is exhausted. Stop the
  assignment now and produce a continuation handoff: compact status,
  completed work, evidence and artifact locations, current state, and the
  remaining work. Do not start new work.

# ---------------------------------------------------------------------------
# return_hints: one short guidance line per return category, selected by
# orchestra.guidance.derive_return_category and looked up by
# orchestra.guidance.return_hint. Categories are exactly:
#   all_succeeded           - builder and verifier jobs succeeded
#   verification_disagreement - a verifier failed while its builder-style
#                               prerequisite succeeded; review findings first
#   budget_exhausted        - a job failed with a dispatcher-recorded budget
#                             wrap-up reason (turn limit or soft timeout)
#   hard_failure            - any other failure
# Precedence when several apply: budget_exhausted > verification_disagreement
# > hard_failure > all_succeeded.
# ---------------------------------------------------------------------------
return_hint_all_succeeded: |-
  All jobs succeeded. Trust the evidence, advance using the result, and
  do not duplicate the work or retest unnecessarily.
return_hint_verification_disagreement: |-
  The verifier does not confirm the builder. Review the verifier's findings
  first before deciding how to proceed.
return_hint_budget_exhausted: |-
  A turn limit or soft timeout was hit; the scope was likely too big.
  Decompose the remaining work and redispatch; completed work is preserved
  in artifacts.
return_hint_hard_failure: |-
  A harness or execution error occurred. Inspect the evidence in artifacts
  and decide how to proceed.
