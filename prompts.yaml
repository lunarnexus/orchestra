default_return_format: |-
  Return only this compact schema unless a blocker needs more detail:
  Status: complete|blocked|failed
  Verdict: pass|fail|n/a
  Artifacts updated:
  - <file or none>
  Files changed:
  - <file or none>
  Commands:
  - <exact command or none> — <result>
  Evidence reused:
  - <artifact path and exact command evidence, or none>
  Material evidence:
  - <one-line decisive evidence>
  Blockers:
  - none|<blocker>
  Risks:
  - none|<risk>
  Next:
  - <next dispatch/action>

  Keep the chat return under 1000 characters when possible. Put durable detail
  in the assigned artifact, not in the chat return. Omit empty fields. Do not
  include broad tables, history narratives, or lists of every file read unless
  material to a blocker or finding.
tool_description: >-
  For non-orchestration work, dispatch a subagent. The orchestrator session
  decomposes requests, plans slices, sequences dispatches, handles user
  decisions and approvals, resolves artifact conflicts, manages git boundaries,
  and synthesizes compact returned results.

  Inspect the whole request only to identify dispatch slices, dependencies,
  blockers, and approval needs. Dispatch one subagent per slice. Dispatch every
  currently unblocked independent slice in parallel before doing anything else.
  Keep dependency order strict: research before dependent design,
  implementation after approved plan/evidence, verification after implementation,
  review after coherent change, and security review after a security-relevant
  change exists.

  Dispatch transfers ownership of the assigned scope to the subagent. While a
  subagent owns a scope, the orchestrator must not read, grep, inspect, edit,
  debug, test, verify, review, security-assess, install packages, update
  dependencies, create virtualenvs, modify lockfiles, or mutate the tool
  environment for that scope. The orchestrator must not run duplicate commands
  or repeat checks that a subagent already ran.
  Trust successful subagent returns for their assigned scope. Do not
  double-test, re-read, or confirm successful subagent work. If evidence is
  missing, failed, blocked, timed out, cancelled, or explicitly incomplete,
  dispatch a smaller follow-up subagent or ask the user for the blocking
  decision. Do not take over the work. Do not read source files, diffs, or
  artifacts merely to confirm a successful return; read only for orchestration
  decisions, conflicts, blockers, destructive/change-boundary approval, or
  final git handoff.

  Give each subagent a self-contained brief with one goal, exact scope,
  boundaries, prior evidence to reuse, artifact write target, stop condition,
  and compact return format.
  Choose the enabled role matching the slice. Use distinct enabled roles for
  each required gate when available; otherwise the workflow assigns that gate
  to the main session.
  Completed subagent reports return automatically. Do not poll. Do not call
  orch_status unless the user explicitly asks for status, history, roles, help,
  doctor, activation, or stop. {roles}
tool_prompt_snippet: ""
tool_prompt_guidelines: []
tool_goal_description: >-
  One small subagent slice: goal, exact scope, prior evidence to reuse, stop
  condition, and return shape.
tool_additional_context_description: >-
  Compact artifact reference for the slice, such as `PLAN.md Slice 2`. Keep
  detailed scope, boundaries, acceptance, and verification in the referenced artifact.
tool_role_description: >-
  Optional subagent capability. Choose the enabled role that best matches the
  slice. Omit role when no specialized enabled role is a better match than the
  default. {roles}
tool_task_label_description: Optional short request label.
main_session_ownership_guidance: >-
  The main-session orchestrator reads failed return artifacts, decides how to
  proceed, and handles run status, recovery decisions, and synthesis. Follow-up
  dispatch continues unfinished operational work after that decision.
status_description: >-
  Use orch_status only when the user explicitly asks for an Orchestra
  status/control/help action in the current session. Use status for active
  subagents, history for completed subagent results, roles for read-only role
  information, doctor for setup checks, help for usage, on to enable Orchestra
  tools and SPSI guidance, and stop with a runId to cancel an owned active run.
  Do not poll for completion. Completed subagent reports return automatically.
status_action_description: >-
  Action to perform: help, doctor, roles, status, history, on, or stop. Use stop
  only with a runId for an active run owned by the current host session.
status_limit_description: Optional positive history limit for action=history.
status_run_id_description: Required run id when action=stop.
status_role_description: Reserved for compatibility; action=roles lists all configured roles.
status_setting_description: Reserved for role updates; model-callable roles are read-only for now.
status_value_description: Reserved for role updates; model-callable roles are read-only for now.
budget_trigger_label: Budget trigger
soft_timeout_block_reason: Orchestra soft timeout reached; return budget handoff
session_mode_off_message: Orchestra tools hidden for this session. Run /orch on to enable them again.
session_mode_on_message: Orchestra tools and SPSI guidance enabled for this session.
return_hint_done: advance the plan using this subagent return; do not repeat its work
return_hint_incomplete: pass this return_path handoff artifact to the next dispatch and continue from it
return_hint_failed: read the failed return artifact and decide how to proceed
return_hint_builder_failed: pass this return_path handoff artifact to one bounded fix-only builder follow-up
budget_exceeded_prompt: |-
  [Orchestra subagent budget exceeded]
  Stop everything you're doing immediately.

  Your only task now, is to create a handoff for the next agent,
  do not continue any previous work.

  Start with:

  ORCHESTRA_STATUS: incomplete
  ORCHESTRA_STOP_REASON: budget_exceeded

  Then return the normal compact result schema as a continuation handoff:

  Status: incomplete
  Verdict: n/a
  Artifacts updated:
  - <file or none>
  Files changed:
  - <file or none>
  Commands:
  - <exact command or none> — <result>
  Evidence reused:
  - <artifact path and exact command evidence, or none>
  Material evidence:
  - <completed work, current state, and data locations>
  Blockers:
  - none|<blocker>
  Risks:
  - none|<risk>
  Next:
  - <small continuation dispatch, including remaining work and stop condition>

  Preserve completed work and make the handoff sufficient for the caller to pass
  this return artifact directly to the continuation dispatch.
host_help: |-
  Orchestra commands:
    /orch help                         Show this help
    /orch on                           Enable Orchestra tools and SPSI guidance
    /orch off                          Hide Orchestra tools for this session
    /orch doctor                       Check Orchestra setup
    /orch do <request>                 Dispatch a subagent
    /orch do --role ROLE <request>     Start a subagent with a role
    /orch roles                        Show configured roles
    /orch roles ROLE SETTING VALUE     Update a role setting
                                       Settings: harness, enabled, model, profile, agent
                                       VALUE for enabled: true, yes, y, 1, on | false, no, n, 0, off
    /orch status                       Show active subagents for this session
    /orch stop <run-id>                Stop an active subagent.
    /orch history [limit]              Show recent results for this session

  Plain text: ask me to delegate, dispatch, use a subagent/sub-agent, ask a subagent,
  or ask another agent.
  auto_return: prompt orchestrator upon return of subagents
