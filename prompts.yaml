default_return_format: >-
  Return the smallest complete answer. If yes/no is enough, answer yes/no plus
  blockers. For research/options/plans, return concise findings with sources or
  file refs. For changes, return files changed, checks run, results, blockers,
  and risks.
tool_description: >-
  Dispatch focused work to Orchestra workers to keep the parent/orchestrator
  context clean. Use for bounded research, planning, implementation, review,
  verification, or safe parallel work. The parent keeps scope, sequencing,
  approvals, and final synthesis. Use an exact configured role; omit role for the
  default. {roles}
tool_prompt_snippet: Dispatch focused work to Orchestra workers/subagents. {roles}
tool_prompt_guidelines:
  - >-
    Use orch_dispatch for all tasks with more than one tool call, role
    specialization, or parallelism.
  - >-
    Keep each request narrow, single purpose/task, and include the expected return detail: yes/no,
    concise report, or files/checks/results.
  - >-
    After a dispatch error, preserve reliability: report the error/status.  For
    timeouts, redispatch with a smaller task.
  - >-
    Use exact enabled roles; omit role for the default.
tool_goal_description: Focused worker request/task to delegate.
tool_role_description: (Optional) specific role; omit for default. {roles}
tool_task_label_description: Optional short request label.
host_help: |-
  Orchestra commands:
    /orch help                         Show this help
    /orch on                           Load the orchestra orchestrator skill
    /orch doctor                       Check Orchestra setup
    /orch do <request>                 Dispatch a subagent
    /orch do --role ROLE <request>     Start a worker with a role
    /orch roles                        Show configured roles
    /orch roles ROLE enabled true|false
                                       Enable or disable a non-default role
    /orch roles ROLE model MODEL       Set a role's model
    /orch status                       Show active workers for this session
    /orch stop <run-id>                Stop an active worker.
    /orch history [limit]              Show recent results for this session

  Plain text: ask me to delegate, dispatch, use a subagent/sub-agent, ask a worker,
  or ask another agent.
  auto_return: prompt orchestrator upon return of workers

  {roles}
