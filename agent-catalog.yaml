default_role: intern
model_limits:
  lmstudio/llmfan46/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved:
    concurrency: 2
  lmstudio/llmfan46/qwen3.6-27b-uncensored-heretic-v2-native-mtp-preserved:
    concurrency: 2
  lmstudio/qwen/qwen3.8-27b:
    concurrency: 2
  lmstudio/LOADED:
    concurrency: 2
harness_configs:
  pi:
    harness: pi
    command:
    - pi
    - --model
    - '{model}'
    - -p
    - '{prompt}'
  hermes:
    harness: hermes
    command:
    - hermes
    - --profile
    - '{profile}'
    - -z
    - '{prompt}'
  opencode:
    harness: opencode
    command:
    - opencode
    - run
    - --agent
    - '{agent}'
    - --model
    - '{model}'
    - '{prompt}'
roles:
  planner:
    harness_config: pi
    model: openai-codex/gpt-5.5
    skills:
    - planner
    prompt_addition: Plan the work. Ask numbered questions for unknowns. May dispatch
      researchers for facts, docs, web, and code evidence. Return concise plan findings
      and open questions.
    main_session_instruction: Main session handles planning and sequencing.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    nested_dispatch_depth: 2
  researcher:
    harness_config: pi
    model: openai-codex/gpt-5.4
    prompt_addition: Gather evidence with sources from docs, web, or code. Do not
      change code. Update only the explicitly assigned RESEARCH.md section when requested. Return
      the compact schema only.
    workflow_instruction: Use researcher for evidence gathering.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills:
    - researcher
  builder:
    harness_config: pi
    model: openai-codex/gpt-5.4-mini
    skills:
    - builder
    prompt_addition: Implement the assigned task only. Stay in scope. Run focused
      implementation commands. Update only assigned artifact sections. Return the
      compact schema only.
    workflow_instruction: Use builder for code changes and implementation slices.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  verifier:
    harness_config: pi
    model: openai-codex/gpt-5.4-mini
    skills:
    - verifier
    prompt_addition: Independently prove whether the work satisfies its scope and
      acceptance criteria using fresh evidence. Stay read-only. Return verdict, evidence,
      missing checks, blockers, and risks. Do not write role-owned `.md` artifacts by default.
    workflow_instruction: Use verifier for independent acceptance checks.
    enabled: auto
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  reviewer:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - reviewer
    prompt_addition: Independently review whether the change is correct, maintainable,
      appropriately scoped, and ready to merge. Stay read-only for source code. Run
      no test commands. Return the compact schema only.
    workflow_instruction: Use reviewer for code-quality review.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  appsec:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - appsec
    prompt_addition: Independently identify realistic vulnerabilities across changed
      trust boundaries. Stay read-only for source code. Return the compact schema only.
    workflow_instruction: Use appsec for security review.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  intern:
    harness_config: pi
    model: openai-codex/gpt-5.4-mini
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  critic:
    harness_config: hermes
    profile: mina
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
