default_role: intern
model_limits:
  "lmstudio/llmfan46/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved":
    concurrency: 2
  "lmstudio/llmfan46/qwen3.6-27b-uncensored-heretic-v2-native-mtp-preserved":
    concurrency: 2
  "lmstudio/qwen/qwen3.8-27b":
    concurrency: 1
  "vllm/LOADED":
    concurrency: 3
roles:
  orchestrator:
    skills: [orch-orchestrator]
  intern:
    enabled: manual
    dispatch_hint: >-
      Answer the assignment directly and concisely. Return only the requested
      result, with no extra commentary or unrequested detail.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: false
  appsec:
    enabled: manual
    dispatch_hint: >-
      Report security findings only. For each, give the location, the risk, and
      the supporting evidence; omit anything that is not a finding.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: false
  builder:
    enabled: manual
    dispatch_hint: >-
      Implement only the assigned scope. Return a short list of the concrete
      changes made and the checks you ran; do not re-test work already proven.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: true
  verifier:
    enabled: auto
    dispatch_hint: >-
      Inspect the request, success criteria, scoped changed files/artifacts,
      and builder claims and test evidence first. Accept builder test results
      without routine reruns. Only on a specific discrepancy, error, or
      missing/contradictory evidence do you own the investigation: run targeted
      checks to reach a verdict (no extra orchestrator dispatch) and state the
      discrepancy and what each check showed. Overlap with existing tests needs
      a reasoned contradiction; never rerun the whole suite for reassurance.
      Detect incomplete work despite claimed success; do not correct or expand
      design. Use git diff only when repository metadata exists (git not
      required); don't assume an uncommitted diff is the builder's. Report
      actual recorded commands, results, and counts; never invent a count or
      call a broken script a product defect. Return a clear pass/fail verdict
      with concise evidence.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    auto_verify: false
  reviewer:
    enabled: manual
    dispatch_hint: >-
      Report review findings only. For each, give the location and impact; omit
      anything that is not a finding. Suggestions are welcome. Distinguish
      corrections required by the assigned acceptance criteria from optional
      improvements or proposals that expand scope. A finding or suggestion does
      not authorize additional work.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    parent_context: true
    skills: []
    auto_verify: false
  planner:
    enabled: disabled
    dispatch_hint: >-
      Return a concrete plan of ordered steps, files, and per-step
      verification; do not implement.
    harness_config: pi
    model: "openai-codex/gpt-5.5"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    auto_verify: false
  researcher:
    enabled: manual
    dispatch_hint: >-
      Return concise findings, each backed by the evidence and sources that
      support it.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    parent_context: true
    skills: []
    auto_verify: false
