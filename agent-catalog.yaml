default_role: intern
model_limits:
  "lmstudio/llmfan46/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved":
    concurrency: 2
  "lmstudio/llmfan46/qwen3.6-27b-uncensored-heretic-v2-native-mtp-preserved":
    concurrency: 2
  "lmstudio/qwen/qwen3.8-27b":
    concurrency: 1
  "vllm/LOADED":
    concurrency: 3
roles:
  intern:
    enabled: manual
    dispatch_hint: >-
      Answer the assignment directly and concisely. Return only the requested
      result, with no extra commentary or unrequested detail.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: false
  appsec:
    enabled: manual
    dispatch_hint: >-
      Report security findings only. For each, give the location, the risk, and
      the supporting evidence; omit anything that is not a finding.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: false
  builder:
    enabled: manual
    dispatch_hint: >-
      Implement only the assigned scope. Return a short list of the concrete
      changes made and the checks you ran; do not re-test work already proven.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    parent_context: true
    auto_verify: true
  verifier:
    enabled: auto
    dispatch_hint: >-
      Judge the referenced work. Return a verdict, the supporting evidence, and
      any discrepancies; nothing else.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    auto_verify: false
  reviewer:
    enabled: manual
    dispatch_hint: >-
      Report review findings only. For each, give the location and impact; omit
      anything that is not a finding.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    parent_context: true
    skills: []
    auto_verify: false
  planner:
    enabled: disabled
    dispatch_hint: >-
      Return a concrete plan of ordered steps, files, and per-step
      verification; do not implement.
    harness_config: pi
    model: "openai-codex/gpt-5.5"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    skills: []
    auto_verify: false
  researcher:
    enabled: manual
    dispatch_hint: >-
      Return concise findings, each backed by the evidence and sources that
      support it.
    harness_config: pi
    model: "vllm/LOADED"
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    parent_context: true
    skills: []
    auto_verify: false
