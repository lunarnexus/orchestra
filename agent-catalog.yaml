# Orchestra agent catalog
# Model strings and command templates are harness-specific.
# Pi format: pi --no-session --model <provider/model> -p "<prompt>"
# Hermes format: hermes --profile <profile> -z "<prompt>"
# OpenCode format: opencode run --agent <agent> --model <provider/model> "<prompt>"
default_role: worker
harness_configs:
  pi:
    harness: pi
    command:
    - pi
    - --no-session
    - --model
    - '{model}'
    - -p
    - '{prompt}'
  hermes:
    harness: hermes
    command:
    - hermes
    - --profile
    - '{profile}'
    - -z
    - '{prompt}'
  opencode:
    harness: opencode
    command:
    - opencode
    - run
    - --agent
    - '{agent}'
    - --model
    - '{model}'
    - '{prompt}'
roles:
  # Optional worker_budget includes the worker itself: 1 means no nested dispatch;
  # 2 lets that worker spawn one terminal worker; omit for the default of 1.
  worker:
    harness_config: pi
    model: openai-codex/gpt-5.4
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "0"
  reviewer:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - code-reviewer
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "0"
  critic:
    harness_config: hermes
    profile: tori
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "0"
  researcher:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Thoroughly research the the assigned topic using official docs, internet, or source code, and return a concise report.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "1"
  appsec:
    harness_config: opencode
    model: openai/gpt-5.4
    agent: plan
    skills:
    - security-reviewer
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "0"
  planner:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    skills:
    - code-planner
    prompt_addition: Focus on the assigned task and return a concise result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: "0"
      HINDSIGHT4PI_AUTO_RECALL: "0"
      HINDSIGHT4PI_CURATION: "0"
      HINDSIGHT4PI_RECALL_DEBUG: "0"
