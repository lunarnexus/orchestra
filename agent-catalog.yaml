default_role: builder
model_limits:
  lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved:
    concurrency: 1
harness_configs:
  pi:
    harness: pi
    command:
    - pi
    - --model
    - '{model}'
    - -p
    - '{prompt}'
  hermes:
    harness: hermes
    command:
    - hermes
    - --profile
    - '{profile}'
    - -z
    - '{prompt}'
  opencode:
    harness: opencode
    command:
    - opencode
    - run
    - --agent
    - '{agent}'
    - --model
    - '{model}'
    - '{prompt}'
roles:
  # example_all_options:
  #   harness_config: pi        # Named harness config from harness_configs.
  #   harness_fallback:         # Optional startup fallback configs, tried in order.
  #   - harness_config: hermes
  #     profile: tori           # Fallback-specific profile override.
  #     model: gpt-5-mini       # Fallback-specific model override.
  #     agent: build            # Fallback-specific agent override.
  #   model: provider/model     # Model passed into harness command templates.
  #   profile: default          # Harness profile passed into command templates.
  #   agent: build              # Harness agent passed into command templates.
  #   prompt_addition: >-       # Extra role instructions appended to worker prompt.
  #     Keep the task focused and return concise evidence.
  #   worker_budget: 2          # Nested Orchestra dispatch budget for this worker.
  #   turn_limit: 30            # Cooperative turn budget before handoff prompt.
  #   soft_timeout: 840         # Cooperative timeout seconds before handoff prompt.
  #   skills:                   # Skills loaded or requested for this role.
  #   - builder
  #   enabled: true             # Whether the role is selectable for dispatch.
  #   env:                      # Extra environment variables for worker process.
  #     EXAMPLE_FLAG: '1'
  #
  # Inline role alternative when not using harness_configs:
  # example_inline_role:
  #   harness: pi               # Harness plugin name.
  #   command: [pi, --model, '{model}', -p, '{prompt}']
  #   model: provider/model
  #   enabled: false
  builder:
    harness_config: pi
    harness_fallback:
    - harness_config: hermes
      profile: tori
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    skills:
    - builder
    prompt_addition: Implement the assigned task only. Stay in scope. Return files
      changed, checks run, results, blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  verifier:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    skills:
    - verifier
    prompt_addition: Independently prove whether the work satisfies its scope and
      acceptance criteria using fresh evidence. Stay read-only. Return verdict, evidence,
      missing checks, blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  reviewer:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - reviewer
    prompt_addition: Independently review whether the change is correct, maintainable,
      appropriately scoped, and ready to merge. Stay read-only. Return only evidence-backed
      material findings and readiness.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  critic:
    harness_config: hermes
    profile: tori
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  researcher:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Execute the evaluation method supplied in the task. Stay read-only
      and return evidence-backed findings.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  intern:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  appsec:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - appsec
    prompt_addition: Independently identify realistic vulnerabilities across changed
      trust boundaries. Stay read-only. Return only evidence-backed material findings
      and security readiness.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  planner:
    harness_config: pi
    model: openai-codex/gpt-5.5
    skills:
    - planner
    prompt_addition: Plan the work. Ask numbered questions for unknowns. May dispatch
      researchers for facts, docs, web, and code evidence. Return concise plan findings
      and open questions.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
    worker_budget: 2
