default_role: builder
harness_configs:
  pi:
    harness: pi
    command:
    - pi
    - --no-session
    - --model
    - '{model}'
    - -p
    - '{prompt}'
  hermes:
    harness: hermes
    command:
    - hermes
    - --profile
    - '{profile}'
    - -z
    - '{prompt}'
  opencode:
    harness: opencode
    command:
    - opencode
    - run
    - --agent
    - '{agent}'
    - --model
    - '{model}'
    - '{prompt}'
roles:
  builder:
    harness_config: pi
    harness_fallback:
    - harness_config: hermes
      profile: tori
    model: openai-codex/gpt-5.4
    skills:
    - builder
    prompt_addition: Implement the assigned task only. Stay in scope. Return files
      changed, checks run, results, blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  verifier:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - reviewer
    prompt_addition: Use reviewer verify mode. Check requested behavior and acceptance
      target. Read-only unless explicitly asked. Return verdict, missing behavior,
      missing checks, blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  reviewer:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - reviewer
    prompt_addition: 'Check work in the requested mode: verify, review, or security.
      Read-only unless explicitly asked. Return verdict, findings, missing checks,
      blockers, and risks.'
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  critic:
    harness_config: hermes
    profile: tori
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: false
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  researcher:
    harness_config: pi
    model: openai-codex/gpt-5.4
    prompt_addition: Gather evidence with sources from docs, web, or code. Do not
      change code. Return concise findings, sources, blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '1'
    skills:
    - researcher
  intern:
    harness_config: pi
    model: lmstudio/qwen3.6-35b-a3b-uncensored-heretic-native-mtp-preserved
    prompt_addition: Focus on the assigned task and return a compact result.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  appsec:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - reviewer
    prompt_addition: Use reviewer security mode. Check secrets, injection, auth, data,
      dependencies, and shell/file/network risks. Return security verdict, findings,
      blockers, and risks.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
  planner:
    harness_config: pi
    model: openai-codex/gpt-5.4
    skills:
    - planner
    prompt_addition: Plan the work. Ask numbered questions for unknowns. May dispatch
      researchers for facts, docs, web, and code evidence. Return concise plan
      findings and open questions.
    enabled: true
    env:
      HINDSIGHT4PI_AUTO_RETAIN: '0'
      HINDSIGHT4PI_AUTO_RECALL: '0'
      HINDSIGHT4PI_CURATION: '0'
      HINDSIGHT4PI_RECALL_DEBUG: '0'
    worker_budget: 2
